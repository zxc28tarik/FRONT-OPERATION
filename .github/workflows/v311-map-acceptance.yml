name: V311 Map final acceptance
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/browser-v311-map-acceptance.mjs'
      - '.github/workflows/v311-map-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-final-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0 three@0.128.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-v311-map-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v311-map-acceptance
          path: test-artifacts/front-operation-e311/
