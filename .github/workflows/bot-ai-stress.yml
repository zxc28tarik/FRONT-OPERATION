name: V49 accelerated 600s bot engine stress
on:
  push:
    branches:
      - ai/v49-cover-route-hysteresis
    paths:
      - .github/workflows/bot-ai-stress.yml
      - scripts/browser-bot-ai-stress.mjs
      - scripts/compare-bot-cover-stress.mjs
      - index.html
  workflow_dispatch:
jobs:
  accelerated-bot-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright / Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Compare identical-seed V48 baseline and V49 route-retention policy
        shell: bash
        run: |
          set -euo pipefail
          git show 625b79c00cad85be1716af1b3d834b72836ef9df:index.html > /tmp/front-operation-v48-control.html
          for seed in 471001 471002 471003; do
            FRONT_OPERATION_GAME_FILE=/tmp/front-operation-v48-control.html FRONT_OPERATION_SEED=$seed FRONT_OPERATION_VARIANT=baseline node scripts/browser-bot-ai-stress.mjs
            FRONT_OPERATION_GAME_FILE=index.html FRONT_OPERATION_SEED=$seed FRONT_OPERATION_VARIANT=candidate node scripts/browser-bot-ai-stress.mjs
          done
          node scripts/compare-bot-cover-stress.mjs 471001 471002 471003
      - name: Upload 600s engine statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-operation-bot-v49-600s
          path: test-artifacts/front-operation-bot-stress/
          if-no-files-found: warn
          retention-days: 14
