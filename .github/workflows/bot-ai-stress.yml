name: V41 accelerated 600s bot engine stress
on:
  push:
    branches:
      - ai/v41-gate-navigation-fix
    paths:
      - .github/workflows/bot-ai-stress.yml
      - scripts/browser-bot-ai-stress.mjs
      - index.html
  workflow_dispatch:
jobs:
  accelerated-bot-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright / Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run 600 simulated seconds of real game bot logic
        run: node scripts/browser-bot-ai-stress.mjs
      - name: Upload 600s engine statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-operation-bot-v41-600s
          path: test-artifacts/front-operation-bot-stress/
          if-no-files-found: warn
          retention-days: 14
