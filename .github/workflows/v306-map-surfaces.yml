name: V306 Map surface acceptance
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/browser-v306-map-surfaces.mjs'
      - '.github/workflows/v306-map-surfaces.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-surface-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0 three@0.128.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-v306-map-surfaces.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v306-map-surfaces
          path: test-artifacts/front-operation-e306/
