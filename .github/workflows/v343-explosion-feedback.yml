name: V343 Explosion presentation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  explosion-feedback:
    if: github.head_ref == 'art/v292-crouch-transition'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0 three@0.128.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-v343-explosion-feedback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v343-explosion-feedback
          path: test-artifacts/front-operation-v343/
