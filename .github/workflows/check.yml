name: Inline JavaScript syntax check
on:
  push:
  pull_request:
jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Verify best approved V5-V25 components
        run: node scripts/check-best-components.mjs
      - name: Validate 3D soldier rigs and visual muzzle placement
        run: node scripts/check-soldier-scene.mjs
      - name: Run BOT AI V32 behavior regression
        run: node tests/bot_ai_v32_regression.cjs
      - name: Run BOT AI V33 behavior regression
        run: node tests/bot_ai_v33_regression.cjs
      - name: Run BOT AI V34 behavior regression
        run: node tests/bot_ai_v34_regression.cjs
      - name: Run BOT AI V35 difficulty mix regression
        run: node tests/bot_ai_v35_regression.cjs
      - name: Run BOT AI V36 movement regression
        run: node tests/bot_ai_v36_regression.cjs
      - name: Run BOT AI V37 observed aim regression
        run: node tests/bot_ai_v37_regression.cjs
      - name: Run BOT AI V38 squad coordination regression
        run: node tests/bot_ai_v38_regression.cjs
      - name: Run BOT AI V39 acoustic investigation regression
        run: node tests/bot_ai_v39_regression.cjs
      - name: Run BOT AI V40 telemetry and 600-second accumulator stress
        run: node tests/bot_ai_v40_regression.cjs
      - name: Run BOT AI V41 physical gate and nav-graph regression
        run: node tests/bot_ai_v41_regression.cjs

      - name: Run BOT AI V42 real-collider route validation regression
        run: node tests/bot_ai_v42_regression.cjs

      - name: Run BOT AI V43 stalled-bot intent diagnostics regression
        run: node tests/bot_ai_v43_regression.cjs

      - name: Run BOT AI V44 medic path clearance regression
        run: node tests/bot_ai_v44_regression.cjs

      - name: Run BOT AI V45 reachable A-star origin regression
        run: node tests/bot_ai_v45_regression.cjs
      - name: Run BOT AI V46 target-cover consistency metrics regression
        run: node tests/bot_ai_v46_regression.cjs

      - name: Run BOT AI V47 cover lifecycle regression
        run: node tests/bot_ai_v47_regression.cjs

      - name: Run BOT AI V47 cover commitment and danger escape regression
        run: node tests/bot_ai_v47_cover_commit_regression.cjs

      - name: Run BOT AI V47 safe-cover target reacquisition regression
        run: node tests/bot_ai_v47_target_cover_regression.cjs
