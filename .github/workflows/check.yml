name: Inline JavaScript syntax check
on:
  push:
  pull_request:
jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JavaScript syntax
        run: node scripts/check-inline-js.mjs
      - name: Verify best approved V5-V25 components
        run: node scripts/check-best-components.mjs
