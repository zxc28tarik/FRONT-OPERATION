name: Front Operation WebGL browser acceptance
on:
  push:
    branches:
      - restore/v25-approved-components-20261122
      - ai/v33-fire-lane-discipline
      - ai/v34-squad-passage-cover
      - ai/v35-difficulty-mix-medium-aim
      - ai/v36-natural-movement-steering
      - ai/v37-observed-target-tracking
      - ai/v38-squad-tactics
      - ai/v39-acoustic-investigation
      - ai/v40-bot-telemetry-balance
      - ai/v41-gate-navigation-fix
      - ai/v42-collider-aware-nav-edges
      - ai/v43-stuck-context-diagnostics
      - ai/v44-medic-walkable-support
      - ai/v45-reachable-nav-origin
      - ai/v46-target-cover-consistency
      - ai/v47-cover-lifecycle-reliability
      - ai/v48-cover-route-recovery
      - ai/v49-cover-route-hysteresis
      - mode/v51-bomb-depot
      - ai/v54-behavior-controller
      - ai/v55-look-controller
      - ai/v56-locomotion
      - ai/v57-navigation
      - ai/v58-map-awareness
      - ai/v59-combat-discipline
      - ai/v60-team-coordination
      - ai/v61-bomb-objectives
      - ai/v62-personalities
      - ai/v63-integrated-validation
      - ai/v72-integrated-acceptance
      - art/v104-character-production
      - art/v109-character-fidelity
      - art/v118-character-combat
      - art/v127-character-motion
      - art/v135-character-refinement
      - art/v145-character-cohesion
      - art/v152-character-surface-motion
      - art/v155-character-continuity
      - art/v170-anatomy-textile-head
      - art/v188-equipment-class-rig
      - art/v200-character-acceptance
      - art/v205-rig-acceptance-hardening
      - art/v210-joint-deformation
  workflow_dispatch:

jobs:
  chromium-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium browser
        run: |
          npm install --no-save playwright@1.55.0 three@0.128.0
          npx playwright install --with-deps chromium
      - name: Validate real geometry and visual arm/LOD
        run: node scripts/check-soldier-real-geometry.mjs
      - name: Test experimental skinned rig bind pose and CPU cost
        if: github.ref_name == 'art/v188-equipment-class-rig' || github.ref_name == 'art/v200-character-acceptance' || github.ref_name == 'art/v205-rig-acceptance-hardening' || github.ref_name == 'art/v210-joint-deformation'
        run: node scripts/check-experimental-skin-rig.mjs
      - name: Run actual WebGL 6v6 match and UI acceptance
        run: node scripts/browser-webgl-smoke.mjs
      - name: Test independent Depot 17 bomb mode
        if: github.ref_name == 'mode/v51-bomb-depot' || github.ref_name == 'ai/v54-behavior-controller' || github.ref_name == 'ai/v55-look-controller' || github.ref_name == 'ai/v56-locomotion' || github.ref_name == 'ai/v57-navigation' || github.ref_name == 'ai/v58-map-awareness' || github.ref_name == 'ai/v59-combat-discipline' || github.ref_name == 'ai/v60-team-coordination' || github.ref_name == 'ai/v61-bomb-objectives' || github.ref_name == 'ai/v62-personalities' || github.ref_name == 'ai/v63-integrated-validation' || github.ref_name == 'ai/v72-integrated-acceptance' || github.ref_name == 'art/v200-character-acceptance' || github.ref_name == 'art/v205-rig-acceptance-hardening' || github.ref_name == 'art/v210-joint-deformation'
        run: node scripts/browser-bomb-depot-smoke.mjs
      - name: Render V25 versus current characters from three angles
        run: node scripts/character-turntable.mjs
      - name: Render V155 versus V170 at equal camera and lighting
        if: github.ref_name == 'art/v170-anatomy-textile-head'
        run: |
          git fetch --depth=1 origin 5616c88177a7803ab25f39058074d9767fb93e8f
          git show 5616c88177a7803ab25f39058074d9767fb93e8f:index.html > /tmp/fo-v155.html
          FO_CHARACTER_BASELINE=/tmp/fo-v155.html node scripts/character-turntable.mjs
      - name: Render V155 versus current candidate
        if: github.ref_name == 'art/v188-equipment-class-rig' || github.ref_name == 'art/v200-character-acceptance' || github.ref_name == 'art/v205-rig-acceptance-hardening' || github.ref_name == 'art/v210-joint-deformation'
        run: |
          git fetch --depth=1 origin 5616c88177a7803ab25f39058074d9767fb93e8f
          git show 5616c88177a7803ab25f39058074d9767fb93e8f:index.html > /tmp/fo-v155.html
          FO_CHARACTER_BASELINE=/tmp/fo-v155.html node scripts/character-turntable.mjs
      - name: Compare 15 rendered bots with both visual rigs
        if: ${{ !cancelled() && (github.ref_name == 'art/v200-character-acceptance' || github.ref_name == 'art/v205-rig-acceptance-hardening' || github.ref_name == 'art/v210-joint-deformation') }}
        run: node scripts/browser-character-rig-ab.mjs
      - name: Save browser screenshots and report even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: front-operation-webgl-browser-qa
          path: test-artifacts/front-operation-browser/
          if-no-files-found: warn
          retention-days: 14
