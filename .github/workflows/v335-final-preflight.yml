name: V335 Final preflight
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  final-preflight:
    if: github.head_ref == 'art/v292-crouch-transition'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0 three@0.128.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-v335-final-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v335-preflight-not-final-acceptance
          path: test-artifacts/front-operation-i335/
          if-no-files-found: warn
