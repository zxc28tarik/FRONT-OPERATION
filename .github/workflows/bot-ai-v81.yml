name: V81 recovery ownership acceptance
on:
  push:
    branches:
      - ai/v81-recovery-ownership
    paths:
      - .github/workflows/bot-ai-v81.yml
      - scripts/browser-bomb-full-round.mjs
      - scripts/browser-bot-ai-stress.mjs
      - scripts/compare-v81-recovery.mjs
      - index.html
  workflow_dispatch:
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [471001, 471002, 471003, 831017, 831031, 831047]
        mode: [marien, bomb]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run both versions with the same starting seed
        shell: bash
        env:
          FRONT_OPERATION_SEED: ${{ matrix.seed }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          git show d7d6fe7fa035bee6499eda8d311c870d7d3b0bda:index.html > /tmp/front-operation-v80.html
          if [ "$MODE" = "marien" ]; then script=scripts/browser-bot-ai-stress.mjs; else script=scripts/browser-bomb-full-round.mjs; fi
          FRONT_OPERATION_VARIANT=baseline FRONT_OPERATION_GAME_FILE=/tmp/front-operation-v80.html node "$script"
          FRONT_OPERATION_VARIANT=candidate FRONT_OPERATION_GAME_FILE=index.html node "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v63-${{ matrix.mode }}-${{ matrix.seed }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
  comparison:
    runs-on: ubuntu-24.04
    needs: paired
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: v63-*
          path: test-artifacts
          merge-multiple: true
      - run: node scripts/compare-v81-recovery.mjs
        env:
          FRONT_OPERATION_BASELINE_LABEL: V80
          FRONT_OPERATION_CANDIDATE_LABEL: V81
      - uses: actions/upload-artifact@v4
        with:
          name: v81-comparison
          path: test-artifacts/v81-comparison/
          retention-days: 14
