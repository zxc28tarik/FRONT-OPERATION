name: V72 multi-version acceptance
on:
  push:
    branches:
      - ai/v72-integrated-acceptance
    paths:
      - .github/workflows/bot-ai-v72.yml
      - scripts/browser-bomb-full-round.mjs
      - scripts/browser-bot-ai-stress.mjs
      - scripts/compare-v72-integrated.mjs
      - index.html
  workflow_dispatch:
jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [471001, 471002, 471003, 831017, 831031, 831047]
        mode: [marien, bomb]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run five versions with the same starting seed
        shell: bash
        env:
          FRONT_OPERATION_SEED: ${{ matrix.seed }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "marien" ]; then script=scripts/browser-bot-ai-stress.mjs; else script=scripts/browser-bomb-full-round.mjs; fi
          git show de6ee3aa2960c8b57aa0f5dd659432d1d9377f71:index.html > /tmp/front-operation-v53.html
          FRONT_OPERATION_VARIANT=v53 FRONT_OPERATION_GAME_FILE=/tmp/front-operation-v53.html node "$script"
          git show 2cd4a28c6e5f23af5d41af15fb4963beaf510306:index.html > /tmp/front-operation-v65.html
          FRONT_OPERATION_VARIANT=v65 FRONT_OPERATION_GAME_FILE=/tmp/front-operation-v65.html node "$script"
          git show 3ef47cec4b598893af095e09a63e0fa7081caeaa:index.html > /tmp/front-operation-v70.html
          FRONT_OPERATION_VARIANT=v70 FRONT_OPERATION_GAME_FILE=/tmp/front-operation-v70.html node "$script"
          git show 7de5ffc23c8b0dc9d82df040eb2f4890eca7f43f:index.html > /tmp/front-operation-v71e.html
          FRONT_OPERATION_VARIANT=v71e FRONT_OPERATION_GAME_FILE=/tmp/front-operation-v71e.html node "$script"
          FRONT_OPERATION_VARIANT=candidate FRONT_OPERATION_GAME_FILE=index.html node "$script"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v72-${{ matrix.mode }}-${{ matrix.seed }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
  comparison:
    runs-on: ubuntu-24.04
    needs: paired
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: v72-*
          path: test-artifacts
          merge-multiple: true
      - run: node scripts/compare-v72-integrated.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v72-comparison
          path: test-artifacts/v72-comparison/
          retention-days: 14
